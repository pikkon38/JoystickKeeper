name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet run --project tests/JoystickKeeper.Tests -c Release

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "args=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; fi

      - name: Publish
        run: >
          dotnet publish src/JoystickKeeper -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          ${{ steps.ver.outputs.args }} -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: JoystickKeeper
          path: publish/JoystickKeeper.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" publish/JoystickKeeper.exe --title "Joystick Keeper $GITHUB_REF_NAME" --generate-notes
